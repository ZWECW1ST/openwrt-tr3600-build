name: Build OpenWrt for Cudy TR3600

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Checkout OpenWrt (PR #24581 branch)
        uses: actions/checkout@v4
        with:
          repository: soapmancn/openwrt
          ref: agent/cudy-tr3600
          path: openwrt

      - name: Add OpenClash feed
        working-directory: openwrt
        run: |
          grep -q "openclash" feeds.conf.default || echo 'src-git openclash https://github.com/vernesong/OpenClash.git;main' >> feeds.conf.default
          cat feeds.conf.default

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync swig unzip \
            zlib1g-dev file wget ca-certificates

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for Cudy TR3600 v1 + OpenClash
        working-directory: openwrt
        run: |
          echo 'CONFIG_TARGET_mediatek=y' > .config
          echo 'CONFIG_TARGET_mediatek_filogic=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600_v1=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-openclash=y' >> .config
          echo 'CONFIG_PACKAGE_dnsmasq-full=y' >> .config
          echo 'CONFIG_PACKAGE_bash=y' >> .config
          echo 'CONFIG_PACKAGE_coreutils=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_ip-full=y' >> .config
          make defconfig
          echo '--- device check ---'
          grep -E 'CONFIG_TARGET_mediatek_filogic_DEVICE' .config
          grep -q 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600_v1=y' .config

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: List built images
        working-directory: openwrt
        run: ls -lh bin/targets/mediatek/filogic/ || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3600-firmware
          if-no-files-found: error
          path: openwrt/bin/targets/mediatek/filogic/*
