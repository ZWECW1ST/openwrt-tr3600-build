name: Build OpenWrt for Cudy TR3600

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Checkout OpenWrt (PR #24581 branch)
        uses: actions/checkout@v4
        with:
          repository: soapmancn/openwrt
          ref: agent/cudy-tr3600
          path: openwrt

      - name: Add OpenClash and iStore feeds
        working-directory: openwrt
        run: |
          grep -q "openclash" feeds.conf.default || echo 'src-git openclash https://github.com/vernesong/OpenClash.git;master' >> feeds.conf.default
          grep -q "istore" feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync swig unzip \
            zlib1g-dev file wget ca-certificates

      - name: Update and install feeds (retry on transient network errors)
        working-directory: openwrt
        run: |
          # openwrt.org 上游偶发 504，最多重试 5 次，每次间隔递增
          for i in 1 2 3 4 5; do
            if ./scripts/feeds update -a; then
              echo "feeds update OK on attempt $i"
              break
            fi
            echo "feeds update attempt $i failed, retrying in $((i*30))s..."
            sleep $((i*30))
          done
          ./scripts/feeds install -a

      - name: Configure for Cudy TR3600 v1 + OpenClash + iStore
        shell: bash {0}
        working-directory: openwrt
        run: |
          set -e
          # 1) 先生成默认配置（基于当前 SNAPSHOT feeds 的真实菜单，不会产生 out-of-sync）
          make defconfig
          # 2) OpenWrt 标准做法：直接追加包符号到 .config（package 层符号由 make 的 kconfig 子系统识别）。
          #    设备符号用连字符 cudy_tr3600-v1（对应 image/filogic.mk 的 define Device/cudy_tr3600-v1）。
          #
          #    ⚠️ 关键历史教训（第22/27轮）：第二次若用 make defconfig 收敛，它会“重新评估并禁用依赖看似不满足
          #       的 =y 符号”——把 luci-app-store 直接丢掉（diffconfig 里完全消失），导致 FATAL: istore lost。
          #       故必须显式声明 luci-app-store 经 luci.mk 隐含的 luci 运行时链（luci-lua-runtime 等），
          #       确保其依赖可满足、defconfig/olddefconfig 都不会丢它。
          #    ⚠️ 关键历史教训（第19-21轮）：olddefconfig 不会把追加包的“DEPENDS 依赖库”自动 select 进来，
          #       所以所有底层库包（lib*/zlib/libruby 等）必须在此显式声明，否则打包报 missing dependencies。
          cat >> .config <<'EOF'
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-lua-runtime=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-lib-taskd=y
          CONFIG_PACKAGE_luci-lib-xterm=y
          CONFIG_PACKAGE_taskd=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-ipt-ipset=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_tar=y
          CONFIG_PACKAGE_mount-utils=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-stty=y
          # 底层库包显式声明（olddefconfig 不自动 select 依赖库，必须手动列出，否则打包 missing dependencies）
          CONFIG_PACKAGE_libacl=y
          CONFIG_PACKAGE_libattr=y
          CONFIG_PACKAGE_libcurl=y
          CONFIG_PACKAGE_libipset=y
          CONFIG_PACKAGE_libbpf=y
          CONFIG_PACKAGE_libelf=y
          CONFIG_PACKAGE_libblkid=y
          CONFIG_PACKAGE_libmount=y
          CONFIG_PACKAGE_libsmartcols=y
          CONFIG_PACKAGE_libuuid=y
          CONFIG_PACKAGE_libfdisk=y
          CONFIG_PACKAGE_libncurses=y
          CONFIG_PACKAGE_libreadline=y
          CONFIG_PACKAGE_libgmp=y
          CONFIG_PACKAGE_libffi=y
          CONFIG_PACKAGE_libyaml=y
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_zlib=y
          CONFIG_PACKAGE_libruby=y
          EOF
          # 3) 收敛：用 make olddefconfig（保留所有显式 =y，包括 luci-app-store，绝不丢包）。
          #    ⚠️ 不要用 make defconfig：defconfig 会重新评估并“禁用依赖看似不满足”的 =y 符号，
          #       把 luci-app-store 丢掉（第22/27轮正是因此 FATAL: istore lost）。
          #    ⚠️ 绝不要 `|| yes '' | make oldconfig`：oldconfig 会按默认值把新增未决符号填 N，
          #       清空依赖子树（第26轮因此 package/install Error 55）。
          #    olddefconfig 在“先 defconfig 再 cat>>”流程下不会 out-of-sync（out-of-sync 仅发生在用 scripts/config 错写时，第15-18轮）。
          make olddefconfig
          # 4) 诊断：用 OpenWrt 官方 diffconfig 正确显示有效配置中我们关心的包
          echo "=== diffconfig (effective config) ==="
          ./scripts/diffconfig.sh 2>/dev/null | grep -E "cudy_tr3600|openclash|luci-app-store|luci-base|rpcd|ucode|bash|ip-full|mount-utils|kmod-tun|kmod-inet-diag|ruby|dnsmasq-full|curl|ca-bundle|ipset|unzip|tar|libuci-lua|taskd|coreutils" | sort
          # 5) 守卫：确保关键功能包及其**基础依赖**确实进入 .config。仅查顶层包会被“半成品配置”放行
          #    （第26轮 luci-app-store=y 仍在，但其依赖的 luci-base/rpcd/ucode 已被清空），故必须校验基础子树。
          for sym in \
            CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y \
            CONFIG_PACKAGE_luci-app-openclash=y \
            CONFIG_PACKAGE_luci-app-store=y \
            CONFIG_PACKAGE_luci-base=y \
            CONFIG_PACKAGE_rpcd=y \
            CONFIG_PACKAGE_ucode=y ; do
            if ! grep -qx "$sym" .config; then echo "FATAL: $sym missing after configure (dependency not satisfied or dropped by defconfig)"; exit 1; fi
          done
          echo "=== DONE CONFIGURE ==="

      - name: Build firmware
        shell: bash {0}
        working-directory: openwrt
        run: |
          set -o pipefail
          # 守卫：复用 Configure 已验证的关键符号（olddefconfig 不丢已显式 =y 的包，这里二次确认）
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y' .config || { echo "FATAL: device symbol lost before build"; exit 1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config || { echo "FATAL: openclash lost before build"; exit 1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-store=y' .config || { echo "FATAL: istore lost before build"; exit 1; }
          # 主编译：并行优先。OpenWrt 的 make 会按依赖顺序先编译后打包，多数“missing dependencies”
          # 是并行打包竞态（某包的 *.provides 尚未落盘）。重跑 make -j 会随 .provides 累积而收敛，
          # 最多重试 3 次；最后一次用 -j1 兜底（彻底避免并行竞态）。
          # 注：已删除旧的“硬编码预编译 package/libs/acl/.compile 等”步骤——这些路径在 SNAPSHOT 已不存在
          #     （No rule to make target），反而导致 Configure 之后立即失败（第25/26轮教训）。
          ATTEMPT=0
          MAX=3
          RC=1
          while [ "$ATTEMPT" -lt "$MAX" ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "=== main build attempt $ATTEMPT/$MAX (parallel) ==="
            make -j"$(nproc)" V=s 2>&1 | tee /tmp/build.log
            RC=${PIPESTATUS[0]}
            if [ "$RC" -eq 0 ]; then
              echo "=== BUILD OK on attempt $ATTEMPT ==="
              break
            fi
            echo "=== attempt $ATTEMPT failed rc=$RC, will retry (converging provides) ==="
          done
          if [ "$RC" -ne 0 ]; then
            echo "=== parallel retries exhausted, last-resort single-threaded ==="
            make -j1 V=s 2>&1 | tee /tmp/build.log
            RC=${PIPESTATUS[0]}
          fi
          exit $RC

      - name: Verify and upload firmware
        working-directory: openwrt
        run: |
          if ls bin/targets/mediatek/filogic/*cudy_tr3600* >/dev/null 2>&1; then
            echo "OK: cudy_tr3600-v1 image present"
          else
            echo "FATAL: no cudy_tr3600-v1 image built"; exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3600-firmware
          if-no-files-found: error
          path: openwrt/bin/targets/mediatek/filogic/*
