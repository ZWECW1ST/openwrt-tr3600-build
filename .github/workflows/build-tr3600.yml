name: Build OpenWrt for Cudy TR3600

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Checkout OpenWrt (PR #24581 branch)
        uses: actions/checkout@v4
        with:
          repository: soapmancn/openwrt
          ref: agent/cudy-tr3600
          path: openwrt

      - name: Add OpenClash and iStore feeds
        working-directory: openwrt
        run: |
          grep -q "openclash" feeds.conf.default || echo 'src-git openclash https://github.com/vernesong/OpenClash.git;master' >> feeds.conf.default
          grep -q "istore" feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          grep -q "fancontrol" feeds.conf.default || echo 'src-git fancontrol https://github.com/JiaY-shi/fancontrol.git;main' >> feeds.conf.default

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync swig unzip \
            zlib1g-dev file wget ca-certificates

      - name: Update and install feeds (retry on transient network errors)
        working-directory: openwrt
        run: |
          # openwrt.org 上游偶发 504，最多重试 5 次，每次间隔递增
          for i in 1 2 3 4 5; do
            if ./scripts/feeds update -a; then
              echo "feeds update OK on attempt $i"
              break
            fi
            echo "feeds update attempt $i failed, retrying in $((i*30))s..."
            sleep $((i*30))
          done
          ./scripts/feeds install -a
          # ★ 关键修复：上次 fancontrol feed 被 feeds update 静默跳过（单 feed 失败非致命），
          # 导致风扇包整组丢失。这里显式验证并失败退出，避免又静默丢包白等 1 小时。
          echo "=== 验证 fancontrol feed 是否真的生效 ==="
          if [ -d "feeds/fancontrol" ] && ls feeds/fancontrol/*/Makefile >/dev/null 2>&1; then
            echo "OK: fancontrol feed 已就位，显式安装风扇包"
            ./scripts/feeds install -p fancontrol fancontrol luci-app-fancontrol
          else
            echo "FATAL: fancontrol feed 拉取失败 (JiaY-shi/fancontrol 在 CI 不可达?)"
            echo "--- feeds.conf.default 中 fancontrol 行 ---"; grep -n fancontrol feeds.conf.default || true
            echo "--- feeds 目录 ---"; ls -d feeds/*/ 2>/dev/null || true
            exit 1
          fi

      - name: Configure for Cudy TR3600 v1 + OpenClash + iStore
        shell: bash {0}
        working-directory: openwrt
        run: |
          set -e
          # ★ 配置方法论（17轮失败换来的结论）：
          #   - `make olddefconfig` 不是 OpenWrt 合法目标（toplevel.mk 只有 config/oldconfig/defconfig/
          #     menuconfig/nconfig）→ 落到 %:: 兜底报 “out of sync … Error 1”（第15-18/28-29轮）。
          #   - `yes '' | make oldconfig` 会把所有新包按默认值设为 =m（OpenWrt 包默认 "m if ALL"），
          #     导致镜像组装 “no such package”（第26轮 package/install Error 55）。
          #   - “先全量 defconfig 再 cat>> 追加再 defconfig” 会让部分追加包被静默丢弃（第22/27轮
          #     luci-app-store/tar/ca-bundle/luci 消失，且无 kconfig 警告）。
          #   - 社区标准做法（P3TERX 等）：.config 只写最小 seed（target/device + 要的包），
          #     然后单次 make defconfig 展开。符号只出现一次，无残留默认配置干扰。
          # 1) 第一次 defconfig：仅为生成 tmpinfo（kconfig 包树 tmp/.config-package.in），
          #    其产生的 .config 马上会被最小 seed 覆盖。
          make defconfig
          # 2) [诊断] 关键包在 kconfig 树中的真实条目（depends/select/可见性）。
          #    若本轮仍丢包，这些条目就是取证依据。
          echo "=== [DIAG] kconfig entries for drop-prone packages ==="
          for p in luci-app-store luci-lib-taskd taskd tar ca-bundle luci luci-light luci-app-package-manager luci-base libruby xz xz-utils liblzma bzip2 libbz2 libzstd; do
            echo "--- config PACKAGE_${p} ---"
            grep -A14 "config PACKAGE_${p}\$" tmp/.config-package.in 2>/dev/null || echo "(symbol not in kconfig tree)"
          done
          # 3) 最小 seed 重写 .config（不是追加！）：target/device 三行 + 全部功能包与底层库。
          #    底层库显式声明是双保险（第19-21轮：依赖库未选中 → 打包 missing dependencies）。
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-lua-runtime=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-compat=y
          # 中文：2024+ 新版 LuCI 翻译经 LUCI_LANG 机制编入 luci-base（非独立包）。
          # 正确 kconfig 符号 = LUCI_LANG_zh_Hans（luci.mk: LUCI_LANG.zh_Hans=简体中文,
          # 别名 LUCI_LC_ALIAS.zh_Hans=zh-cn）。旧符号 CONFIG_PACKAGE_luci-i18n-base-zh-cn
          # 与 CONFIG_LUCI_LANG_zh_cn 均不合法，会被 defconfig 静默丢弃（上一版没中文根因）。
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-lib-taskd=y
          CONFIG_PACKAGE_luci-lib-xterm=y
          CONFIG_PACKAGE_taskd=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-ipt-ipset=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_tar=y
          # tar 的条件依赖链（第30轮 kconfig 内省实锤）：luci-app-store 继承了 tar 的
          # `depends on !(PACKAGE_TAR_XZ) || PACKAGE_xz-utils` —— tar=y 时 TAR_XZ 默认 y，
          # 若 xz-utils 未选中则该 depends 不满足 → store 被 kconfig 静默强制为 n。
          # 必须显式选中 xz/xz-utils/liblzma（及 bzip2/libzstd 等 TAR_* 条件子项依赖）：
          CONFIG_PACKAGE_xz=y
          CONFIG_PACKAGE_xz-utils=y
          CONFIG_PACKAGE_liblzma=y
          # 风扇控制：社区 pwm-fan 调速服务 + LuCI 控制台（TR3600 自带风扇，
          # kmod-hwmon-pwmfan 已作为 device_package 编入镜像；此二项提供 Web 端风扇设置页）。
          CONFIG_PACKAGE_fancontrol=y
          CONFIG_PACKAGE_luci-app-fancontrol=y
          CONFIG_PACKAGE_bzip2=y
          CONFIG_PACKAGE_libbz2=y
          CONFIG_PACKAGE_zstd=y
          CONFIG_PACKAGE_libzstd=y
          CONFIG_PACKAGE_mount-utils=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-stty=y
          CONFIG_PACKAGE_script-utils=y
          CONFIG_PACKAGE_procd=y
          CONFIG_PACKAGE_libacl=y
          CONFIG_PACKAGE_libattr=y
          CONFIG_PACKAGE_libcurl=y
          CONFIG_PACKAGE_libipset=y
          CONFIG_PACKAGE_libbpf=y
          CONFIG_PACKAGE_libelf=y
          CONFIG_PACKAGE_libblkid=y
          CONFIG_PACKAGE_libmount=y
          CONFIG_PACKAGE_libsmartcols=y
          CONFIG_PACKAGE_libuuid=y
          CONFIG_PACKAGE_libfdisk=y
          CONFIG_PACKAGE_libncurses=y
          CONFIG_PACKAGE_libreadline=y
          CONFIG_PACKAGE_libgmp=y
          CONFIG_PACKAGE_libffi=y
          CONFIG_PACKAGE_libyaml=y
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_zlib=y
          CONFIG_PACKAGE_libruby=y
          EOF
          # 3.5) 默认中文：通过 files/ 覆盖注入 uci-defaults，首次启动即设为简体中文
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/30_luci_lang <<'UCI'
          #!/bin/sh
          uci -q set system.@system[0].language='zh-cn'
          uci -q set luci.main.lang='zh-cn'
          uci commit system
          uci commit luci
          exit 0
          UCI
          chmod +x files/etc/uci-defaults/30_luci_lang
          # 4) 收敛：单次 make defconfig 展开（OpenWrt 合法目标；=y 保留，+deps 经 select 拉入）
          make defconfig
          # 5) 诊断 + 守卫（失败时附带取证输出）
          echo "=== diffconfig (effective config) ==="
          ./scripts/diffconfig.sh 2>/dev/null | grep -E "cudy_tr3600|openclash|luci-app-store|luci-base|rpcd|ucode|bash|ip-full|mount-utils|kmod-tun|kmod-inet-diag|ruby|dnsmasq-full|curl|ca-bundle|ipset|unzip|tar|libuci-lua|taskd|coreutils" | sort
          MISSING=0
          for sym in \
            CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y \
            CONFIG_PACKAGE_luci-app-openclash=y \
            CONFIG_PACKAGE_luci-app-store=y \
            CONFIG_PACKAGE_luci-base=y \
            CONFIG_PACKAGE_rpcd=y \
            CONFIG_PACKAGE_ucode=y ; do
            if ! grep -qx "$sym" .config; then echo "MISSING: $sym"; MISSING=1; fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "=== [DIAG] .config 中相关符号实际状态 ==="
            grep -nE "luci-app-store|PACKAGE_tar|ca-bundle|PACKAGE_luci=|PACKAGE_luci-light|taskd" .config || true
            echo "FATAL: critical symbols missing after configure (see [DIAG] kconfig entries above)"
            exit 1
          fi
          echo "=== DONE CONFIGURE ==="

      - name: Build firmware
        shell: bash {0}
        working-directory: openwrt
        run: |
          set -o pipefail
          # 守卫：复用 Configure 已验证的关键符号（最小 seed + defconfig 已确保，这里二次确认）
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y' .config || { echo "FATAL: device symbol lost before build"; exit 1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config || { echo "FATAL: openclash lost before build"; exit 1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-store=y' .config || { echo "FATAL: istore lost before build"; exit 1; }
          # 主编译：并行优先。OpenWrt 的 make 会按依赖顺序先编译后打包，多数“missing dependencies”
          # 是并行打包竞态（某包的 *.provides 尚未落盘）。重跑 make -j 会随 .provides 累积而收敛，
          # 最多重试 3 次；最后一次用 -j1 兜底（彻底避免并行竞态）。
          # 注：已删除旧的“硬编码预编译 package/libs/acl/.compile 等”步骤——这些路径在 SNAPSHOT 已不存在
          #     （No rule to make target），反而导致 Configure 之后立即失败（第25/26轮教训）。
          ATTEMPT=0
          MAX=3
          RC=1
          while [ "$ATTEMPT" -lt "$MAX" ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "=== main build attempt $ATTEMPT/$MAX (parallel) ==="
            make -j"$(nproc)" V=s IGNORE_ERRORS=1 2>&1 | tee /tmp/build.log
            RC=${PIPESTATUS[0]}
            if [ "$RC" -eq 0 ]; then
              echo "=== BUILD OK on attempt $ATTEMPT ==="
              break
            fi
            echo "=== attempt $ATTEMPT failed rc=$RC, will retry (converging provides) ==="
          done
          if [ "$RC" -ne 0 ]; then
            echo "=== parallel retries exhausted, last-resort single-threaded ==="
            make -j1 V=s IGNORE_ERRORS=1 2>&1 | tee /tmp/build.log
            RC=${PIPESTATUS[0]}
          fi
          exit $RC

      - name: Verify and upload firmware
        working-directory: openwrt
        run: |
          if ls bin/targets/mediatek/filogic/*cudy_tr3600* >/dev/null 2>&1; then
            echo "OK: cudy_tr3600-v1 image present"
          else
            echo "FATAL: no cudy_tr3600-v1 image built"; exit 1
          fi
          echo "=== 关键功能核对（非致命，仅用于记录）==="
          # 中文：SNAPSHOT 下经 LUCI_LANG 编入 luci-base，看 config.buildinfo 符号而非 manifest 独立包名
          if grep -q "LUCI_LANG_zh_Hans=y" bin/targets/mediatek/filogic/config.buildinfo 2>/dev/null; then
            echo "  [OK] 中文界面 (LUCI_LANG_zh_Hans 已编入 luci-base)"
          else
            echo "  [MISSING] 中文符号 LUCI_LANG_zh_Hans 未编入"
          fi
          for p in kmod-hwmon-pwmfan fancontrol luci-app-fancontrol; do
            if grep -q "$p" bin/targets/mediatek/filogic/*.manifest 2>/dev/null; then
              echo "  [OK] $p"
            else
              echo "  [MISSING] $p"
            fi
          done

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3600-firmware
          if-no-files-found: error
          path: openwrt/bin/targets/mediatek/filogic/*
