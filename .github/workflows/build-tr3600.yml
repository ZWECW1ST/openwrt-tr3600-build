name: Build OpenWrt for Cudy TR3600

on:
  workflow_dispatch:
  # 监控自动化在检测到失败时会自动重跑本工作流

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Checkout OpenWrt (PR #24581 branch)
        uses: actions/checkout@v4
        with:
          repository: soapmancn/openwrt
          ref: agent/cudy-tr3600
          path: openwrt

      - name: Add OpenClash and iStore feeds
        working-directory: openwrt
        run: |
          grep -q "openclash" feeds.conf.default || echo 'src-git openclash https://github.com/vernesong/OpenClash.git;master' >> feeds.conf.default
          grep -q "istore" feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync swig unzip \
            zlib1g-dev file wget ca-certificates

      - name: Update and install feeds (retry on transient network errors)
        working-directory: openwrt
        run: |
          # openwrt.org 上游偶发 504，最多重试 5 次，每次间隔递增
          for i in 1 2 3 4 5; do
            if ./scripts/feeds update -a; then
              echo "feeds update OK on attempt $i"
              break
            fi
            echo "feeds update attempt $i failed, retrying in $((i*30))s..."
            sleep $((i*30))
          done
          ./scripts/feeds install -a

      - name: Configure for Cudy TR3600 v1 + OpenClash + iStore
        working-directory: openwrt
        run: |
          set -e
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600_v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-lua-runtime=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-lib-taskd=y
          CONFIG_PACKAGE_luci-lib-xterm=y
          CONFIG_PACKAGE_taskd=y
          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_tar=y
          CONFIG_PACKAGE_coreutils-stty=y
          EOF
          make olddefconfig
          # 设备符号校验（防错设备砖机）
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600_v1=y' .config || { echo "FATAL: cudy_tr3600_v1 not set"; exit 1; }

      - name: Build firmware
        working-directory: openwrt
        run: |
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600_v1=y' .config || { echo "FATAL: device symbol lost before build"; exit 1; }
          make -j"$(nproc)" V=s 2>&1 | tee /tmp/build.log || { echo "=== parallel failed, retry single-threaded ==="; make -j1 V=s 2>&1 | tee /tmp/build.log; }

      - name: Verify and upload firmware
        working-directory: openwrt
        run: |
          if ls bin/targets/mediatek/filogic/*cudy_tr3600* >/dev/null 2>&1; then
            echo "OK: cudy_tr3600-v1 image present"
          else
            echo "FATAL: no cudy_tr3600-v1 image built"; exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3600-firmware
          if-no-files-found: error
          path: openwrt/bin/targets/mediatek/filogic/*
