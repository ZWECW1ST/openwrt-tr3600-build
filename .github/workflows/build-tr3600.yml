name: Build OpenWrt for Cudy TR3600

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Checkout OpenWrt (PR #24581 branch)
        uses: actions/checkout@v4
        with:
          repository: soapmancn/openwrt
          ref: agent/cudy-tr3600
          path: openwrt

      - name: Add OpenClash and iStore feeds
        working-directory: openwrt
        run: |
          grep -q "openclash" feeds.conf.default || echo 'src-git openclash https://github.com/vernesong/OpenClash.git;master' >> feeds.conf.default
          grep -q "istore" feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync swig unzip \
            zlib1g-dev file wget ca-certificates

      - name: Update and install feeds (retry on transient network errors)
        working-directory: openwrt
        run: |
          # openwrt.org 上游偶发 504，最多重试 5 次，每次间隔递增
          for i in 1 2 3 4 5; do
            if ./scripts/feeds update -a; then
              echo "feeds update OK on attempt $i"
              break
            fi
            echo "feeds update attempt $i failed, retrying in $((i*30))s..."
            sleep $((i*30))
          done
          ./scripts/feeds install -a

      - name: Configure for Cudy TR3600 v1 + OpenClash + iStore
        shell: bash {0}
        working-directory: openwrt
        run: |
          set +e
          make defconfig
          # 用 scripts/config --set-val 直接写入符号值（绕过依赖检查，避免 olddefconfig 的 out-of-sync 拒绝）
          # 设备符号用连字符 cudy_tr3600-v1（对应 image/filogic.mk 的 define Device/cudy_tr3600-v1）
          SYMS=(
            TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1
            PACKAGE_luci PACKAGE_luci-base PACKAGE_luci-lua-runtime PACKAGE_luci-i18n-base-zh-cn PACKAGE_luci-compat
            PACKAGE_luci-app-openclash PACKAGE_dnsmasq-full PACKAGE_bash PACKAGE_curl PACKAGE_ca-bundle
            PACKAGE_ip-full PACKAGE_ipset PACKAGE_ruby PACKAGE_ruby-yaml PACKAGE_kmod-tun PACKAGE_kmod-inet-diag PACKAGE_unzip
            PACKAGE_luci-app-store PACKAGE_luci-lib-taskd PACKAGE_luci-lib-xterm PACKAGE_taskd
            PACKAGE_libuci-lua PACKAGE_tar PACKAGE_mount-utils PACKAGE_coreutils PACKAGE_coreutils-stty
          )
          for s in "${SYMS[@]}"; do
            if ./scripts/config --set-val "CONFIG_$s" y 2>/dev/null; then
              echo "SET OK: CONFIG_$s"
            else
              echo "SET FAIL: CONFIG_$s (symbol may not exist in this kconfig)"
            fi
          done
          # 非交互收敛：未决符号取默认，不报 out of sync
          yes '' | make oldconfig >/dev/null 2>&1
          echo "=== resolve state after set-val + oldconfig ==="
          for s in "${SYMS[@]}"; do
            st=$(scripts/config --state "CONFIG_$s" 2>/dev/null || echo "undef")
            echo "  CONFIG_$s = $st"
          done
          # 守卫：设备符号与 OpenClash/iStore 必须 =y
          for s in TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1 PACKAGE_luci-app-openclash PACKAGE_luci-app-store; do
            if grep -qx "CONFIG_$s=y" .config; then echo "GUARD OK: $s"; else echo "GUARD FAIL: $s not =y"; fi
          done
          echo "=== DONE CONFIGURE ==="

      - name: Build firmware
        shell: bash {0}
        working-directory: openwrt
        run: |
          set +e
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y' .config || { echo "FATAL: device symbol lost before build"; exit 1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config || { echo "FATAL: openclash lost before build"; exit 1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-store=y' .config || { echo "FATAL: istore lost before build"; exit 1; }
          make -j"$(nproc)" V=s 2>&1 | tee /tmp/build.log || { echo "=== parallel failed, retry single-threaded ==="; make -j1 V=s 2>&1 | tee /tmp/build.log; }

      - name: Verify and upload firmware
        working-directory: openwrt
        run: |
          if ls bin/targets/mediatek/filogic/*cudy_tr3600* >/dev/null 2>&1; then
            echo "OK: cudy_tr3600-v1 image present"
          else
            echo "FATAL: no cudy_tr3600-v1 image built"; exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3600-firmware
          if-no-files-found: error
          path: openwrt/bin/targets/mediatek/filogic/*
